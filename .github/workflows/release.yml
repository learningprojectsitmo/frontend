name: Release frontend (build + push GHCR + dispatch)

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            ref:
                description: "Build ref/branch (default: current)"
                required: false
                default: main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: learningprojectsitmo/frontend

# push в GHCR (learningprojectsitmo) — приватный репо-пакет
permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build-push:
        name: Build & push static image to GHCR
        runs-on: ubuntu-latest
        env:
            RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.ref || 'main' }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=branch   # main (обновляемый)
                      type=sha,prefix=sha-     # sha-… (иммутабельный, для rollback)

            # Vite build происходит ВНУТРИ Dockerfile.prod (build-stage),
            # поэтому артефакт runtime-конфига (config.js) уже в статике.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: Dockerfile.prod
                  build-args: |
                      VITE_APP_API_URL=${{ vars.VITE_APP_API_URL || '/v1' }}
                      VITE_APP_ENABLE_API_MOCKING=${{ vars.VITE_APP_ENABLE_API_MOCKING || 'false' }}
                      VITE_APP_SENTRY_DSN=${{ vars.VITE_APP_SENTRY_DSN }}
                      VITE_APP_SENTRY_ENVIRONMENT=${{ vars.VITE_APP_SENTRY_ENVIRONMENT || 'production' }}
                      VITE_APP_SENTRY_TRACES_SAMPLE_RATE=${{ vars.VITE_APP_SENTRY_TRACES_SAMPLE_RATE || '0.01' }}
                      VITE_APP_SENTRY_ERRORS_SAMPLE_RATE=${{ vars.VITE_APP_SENTRY_ERRORS_SAMPLE_RATE || '0.5' }}
                      VITE_APP_YANDEX_METRIKA_ID=${{ vars.VITE_APP_YANDEX_METRIKA_ID }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=max,scope=frontend

            # Уведомить deploy-репозиторий (только если настроен токен)
            - name: Notify deploy repo
              if: env.RELEASE_TOKEN != ''
              uses: peter-evans/repository-dispatch@v3
              with:
                  token: ${{ env.RELEASE_TOKEN }}
                  repository: learningprojectsitmo/deploy
                  event-type: frontend-updated
                  client-payload: '{"services":"frontend","image":"ghcr.io/learningprojectsitmo/frontend:main"}'
